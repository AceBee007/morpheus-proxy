name: morpheus-proxy-demo

services:
  ms-a:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ms-a
    image: morpheus-proxy-demo/ms-a:local
    environment:
      HTTP_ADDR: :8080
      GRPC_ADDR: :50051
      MS_B_ADDR: ms-a-istio:15001
      MS_B_ANIMAL_SOUND_ADDR: morpheus-proxy:15052
      GRPC_PROXY_ADDR: morpheus-proxy:15000
    expose:
      - "8080"
      - "50051"

  morpheus-proxy:
    build:
      context: ..
      dockerfile: Dockerfile
    image: morpheus-proxy:local
    environment:
      LOG_DIR: /var/log/morpheus-proxy
      HTTP_FORWARD_LISTEN_PORT: 18080
      HTTP_FORWARD_TARGET: ms-a:8080
      GRPC_FORWARD_LISTEN_PORT: 15051
      GRPC_FORWARD_TARGET: ms-a:50051
      CONNECT_LISTEN_PORT: 15000
      ANIMAL_SOUND_LISTEN_PORT: 15052
      ANIMAL_SOUND_DUMMY_VALUE: Dummy
    volumes:
      - ./logs/morpheus-proxy:/var/log/morpheus-proxy
    expose:
      - "15000"
      - "15051"
      - "15052"
      - "18080"

  ms-a-istio:
    image: ${ISTIO_PROXY_IMAGE:-docker.io/istio/proxyv2:1.25.0}
    entrypoint: ["/usr/local/bin/envoy"]
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--service-cluster"
      - "ms-a-istio"
      - "--log-level"
      - "warning"
    volumes:
      - ./envoy/ms-a.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${MS_A_HTTP_PORT:-18080}:8080"
      - "${MS_A_GRPC_PORT:-15051}:50051"
    depends_on:
      - ms-a
      - morpheus-proxy
      - ms-b-istio

  ms-b:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ms-b
    image: morpheus-proxy-demo/ms-b:local
    environment:
      GRPC_ADDR: :50052
    expose:
      - "50052"

  ms-b-istio:
    image: ${ISTIO_PROXY_IMAGE:-docker.io/istio/proxyv2:1.25.0}
    entrypoint: ["/usr/local/bin/envoy"]
    command:
      - "-c"
      - "/etc/envoy/envoy.yaml"
      - "--service-cluster"
      - "ms-b-istio"
      - "--log-level"
      - "warning"
    volumes:
      - ./envoy/ms-b.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - ms-b

  grpcurl:
    image: fullstorydev/grpcurl:latest
    profiles:
      - tools
    entrypoint: ["grpcurl"]
    volumes:
      - ./proto:/proto:ro
