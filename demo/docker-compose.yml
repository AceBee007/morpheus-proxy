name: morpheus-proxy-demo

# Local reproduction of the CONNECT-inspect egress path (docs/spec.md 4.14):
#
#   client -> ms-a
#   ms-a --(GRPC_PROXY_ADDR, HTTP CONNECT)--> morpheus-proxy -> ms-b
#             └── ms-a's downstream address (ms-b:50052) is UNCHANGED; it only
#                 gains GRPC_PROXY_ADDR. morpheus uses the CONNECT authority as
#                 the per-connection upstream and can inspect / mock / fault the
#                 ms-a -> ms-b calls.
#
# morpheus is configured purely by a JSONC file (MORPHEUS_CONFIG), matching how
# the real app is configured. There is no istio here: docker compose has no mesh
# iptables capture, so the mTLS hop (morpheus -> istio -> ms-b) that happens in a
# real k8s pod is omitted locally. See demo/k8s/ms-a-morpheus-connect.yaml and
# spec 3.2 / 4.14 for the in-mesh deployment.

services:
  ms-a:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ms-a
    image: morpheus-proxy-demo/ms-a:local
    environment:
      HTTP_ADDR: :8080
      GRPC_ADDR: :50051
      # downstream addresses stay pointed at the real service...
      MS_B_ADDR: ms-b:50052
      MS_B_ANIMAL_SOUND_ADDR: ms-b:50052
      # ...the only change: send gRPC dials through the morpheus CONNECT proxy
      GRPC_PROXY_ADDR: morpheus-proxy:15052
    ports:
      - "${MS_A_HTTP_PORT:-18080}:8080"
      - "${MS_A_GRPC_PORT:-50051}:50051"
    depends_on:
      - morpheus-proxy
      - ms-b

  morpheus-proxy:
    build:
      context: ..
      dockerfile: Dockerfile
    image: morpheus-proxy:local
    environment:
      MORPHEUS_CONFIG: /etc/morpheus/morpheus.jsonc
    volumes:
      - ./morpheus.jsonc:/etc/morpheus/morpheus.jsonc:ro
    ports:
      # admin API + web UI; the CONNECT listener (15052) stays internal to the
      # compose network (only ms-a needs it)
      - "${MORPHEUS_PROXY_STATUS_PORT:-18081}:18081"

  ms-b:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ms-b
    image: morpheus-proxy-demo/ms-b:local
    environment:
      GRPC_ADDR: :50052

  grpcurl:
    image: fullstorydev/grpcurl:latest
    profiles:
      - tools
    entrypoint: ["grpcurl"]
    volumes:
      - ./proto:/proto:ro
