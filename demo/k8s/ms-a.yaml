apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-a
  namespace: morpheus-proxy-demo
  labels:
    app.kubernetes.io/name: ms-a
    app.kubernetes.io/part-of: morpheus-proxy-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-a
        app.kubernetes.io/part-of: morpheus-proxy-demo
    spec:
      containers:
        - name: ms-a
          image: asia-northeast1-docker.pkg.dev/GCP_PROJECT_ID_OLD_REDACTED/morpheus-proxy-demo/ms-a:latest
          imagePullPolicy: Always
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":50051"
            - name: MS_B_ADDR
              value: "ms-b:50052"
            - name: MS_B_ANIMAL_SOUND_ADDR
              value: "ms-b:50052"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-a
  namespace: morpheus-proxy-demo
  labels:
    app.kubernetes.io/name: ms-a
    app.kubernetes.io/part-of: morpheus-proxy-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ms-a
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
