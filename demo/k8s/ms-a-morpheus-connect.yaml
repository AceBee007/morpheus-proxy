# ms-a with morpheus-proxy as a CONNECT egress sidecar (docs/spec.md 4.14).
#
#   ms-a app --(GRPC_PROXY_ADDR)--> morpheus :15052 (CONNECT) --> ms-b:50052
#                                        └── inspects/manipulates ms-a -> ms-b
#
# Unlike ms-a-morpheus-sidecar.yaml (reverse, one outbound listener per
# downstream + a rewritten MS_B_ADDR), here the app keeps every downstream
# address unchanged and only gains a single GRPC_PROXY_ADDR. morpheus accepts an
# HTTP CONNECT tunnel, uses the CONNECT authority (ms-b:50052, ms-c:..., ...) as
# the per-connection upstream, runs the rule pipeline on the plaintext h2c, then
# forwards to the real downstream (Istio mTLS-wraps morpheus -> downstream).
#
# The Service targetPort is NOT changed: peer -> ms-a traffic reaches the app
# directly. Only ms-a's OUTBOUND gRPC calls are intercepted, which is the
# "ms-a -> morpheus -> istio -> ms-b" goal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: morpheus-proxy-config
  namespace: morpheus-proxy-demo
data:
  morpheus.jsonc: |
    {
      "admin": { "host": "127.0.0.1", "port": 18081, "basePath": "/_morpheus" },
      "listeners": [
        {
          "name": "grpc-egress",
          "protocol": "grpc",
          "host": "127.0.0.1",
          "port": 15052,
          "mode": "connect"
        }
      ],
      "logging": {
        "trafficLogDir": "/tmp/morpheus/traffic",
        "appLogDir": "/tmp/morpheus/app"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-a
  namespace: morpheus-proxy-demo
  labels:
    app: ms-a
    app.kubernetes.io/name: ms-a
    app.kubernetes.io/part-of: morpheus-proxy-demo
    version: main
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-a
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: ms-a
        sidecar.istio.io/proxyCPU: "125m"
        sidecar.istio.io/proxyCPULimit: "300m"
        sidecar.istio.io/proxyMemory: "256Mi"
        sidecar.istio.io/proxyMemoryLimit: "256Mi"
        traffic.sidecar.istio.io/excludeOutboundIPRanges: 169.254.169.254/32
      labels:
        app: ms-a
        app.kubernetes.io/name: ms-a
        app.kubernetes.io/part-of: morpheus-proxy-demo
        sidecar.istio.io/inject: "true"
        version: main
    spec:
      containers:
        # --- application: downstream addresses UNCHANGED; only GRPC_PROXY_ADDR is added ---
        - name: ms-a
          image: asia-northeast1-docker.pkg.dev/${GCP_PROJECT_ID}/morpheus-proxy-demo/ms-a:latest
          imagePullPolicy: Always
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":50051"
            # downstream addresses stay pointed at the real services
            - name: MS_B_ADDR
              value: "ms-b:50052"
            - name: MS_B_ANIMAL_SOUND_ADDR
              value: "ms-b:50052"
            # the only change: send gRPC dials through the morpheus CONNECT proxy
            - name: GRPC_PROXY_ADDR
              value: "127.0.0.1:15052"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
        # --- morpheus-proxy sidecar (CONNECT egress listener only) ---
        - name: morpheus-proxy
          image: asia-northeast1-docker.pkg.dev/${GCP_PROJECT_ID}/morpheus-proxy-demo/morpheus-proxy:latest
          imagePullPolicy: Always
          env:
            - name: MORPHEUS_CONFIG
              value: /etc/morpheus/morpheus.jsonc
          # admin (18081) and the CONNECT listener (15052) are loopback-only: reach the
          # admin API / UI with kubectl port-forward. Probes must therefore use exec
          # (kubelet httpGet probes target the pod IP).
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:18081/_morpheus/healthz/ready"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:18081/_morpheus/healthz/live"]
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: morpheus-config
              mountPath: /etc/morpheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: morpheus-config
          configMap:
            name: morpheus-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: ms-a
  namespace: morpheus-proxy-demo
  labels:
    app: ms-a
    app.kubernetes.io/name: ms-a
    app.kubernetes.io/part-of: morpheus-proxy-demo
    version: main
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ms-a
  ports:
    # inbound is unchanged: peer traffic reaches the ms-a app directly
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
    # the morpheus admin API / UI is loopback-only (use kubectl port-forward)
